# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: kafka Demo (Java CI with Maven)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Needed so the dependency submission action can write to the dependency graph
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module:
          # Paths to your two pom.xml directories (relative to repo root)
          - cab-book-driver-kafka-demo/cab-book-driver-kafka-demo
          - cab-book-user-kafka-demo/cab-book-user-kafka-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven - ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B clean verify

      # Optional: Submit dependency graph for Dependabot / dependency graph features
      - name: Submit dependency snapshot - ${{ matrix.module }}
        uses: advanced-security/maven-dependency-submission-action@v4
        with:
          directory: ${{ matrix.module }}
          correlator: ${{ github.job }}-${{ matrix.module }}
